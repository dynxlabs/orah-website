<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TEMPORAL: placeholder mientras se monta el sitio. Quitar al publicar la landing real. -->
  <meta name="robots" content="noindex">
  <title>Orah — Reservas que se llenan solas</title>
  <meta name="description" content="Orah convierte tu disponibilidad en reservas confirmadas. Plataforma de reservas y agendamiento de DYNX Labs.">
  <meta name="theme-color" content="#0e5e68">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/logo-square.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--acc:#0e5e68;--page:#edeff2;--surface:#ffffff;--ink:#141b22;--muted:#5e6873;--line:#e7eaee;}
    @media(prefers-color-scheme:dark){:root{--acc:#4FB3BF;--page:#0d1117;--surface:#161b22;--ink:#e6edf3;--muted:#8b97a3;--line:#28313c;}}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
      color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
      background:
        radial-gradient(ellipse at 15% 10%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 45%),
        radial-gradient(ellipse at 85% 92%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 45%),
        var(--page);}
    .card{max-width:460px;}
    .logo{height:48px;width:auto;}
    h1{margin:30px 0 0;font-size:clamp(27px,5vw,38px);font-weight:300;letter-spacing:-.045em;line-height:1.12;}
    h1 b{font-weight:700;} h1 .ac{color:var(--acc);font-weight:600;}
    p{margin:18px auto 0;max-width:360px;color:var(--muted);font-size:15px;line-height:1.6;}
    .tag{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:9px 16px;border-radius:999px;
      border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);}
    .tag i{width:8px;height:8px;border-radius:50%;background:var(--acc);}
    footer{margin-top:36px;font-size:12.5px;color:var(--muted);}
    footer a{color:var(--acc);font-weight:600;text-decoration:none;}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/icons/logo.svg" alt="Orah">
    <h1>Reservas <b>que se llenan solas,</b> con <span class="ac">Orah</span></h1>
    <p>Estamos construyendo la web de Orah. Muy pronto, aquí.</p>
    <div class="tag"><i></i>Sitio en construcción</div>
    <footer>Un producto de <a href="https://dynxlabs.com">DYNX Labs</a></footer>
  </main>
</body>
</html>
